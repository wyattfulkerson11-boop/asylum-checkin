<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Check In">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<title>Asylum Check-In</title>
<style>
  :root { --bg:#000; --card:#141414; --line:#333; --ink:#fff; --dim:#a3a3a3; --red:#c8102e; --gold:#d4af37; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; margin:0; overscroll-behavior:none; }
  body { background:var(--bg); color:var(--ink); font:20px/1.3 -apple-system, system-ui, sans-serif;
         -webkit-user-select:none; user-select:none; touch-action:manipulation; }
  #app { min-height:100%; display:flex; flex-direction:column; padding:24px max(24px, env(safe-area-inset-left)) 0; }
  .brand { display:flex; align-items:center; gap:16px; border-bottom:3px solid var(--red); padding-bottom:16px; margin-bottom:14px; }
  .brand img { width:76px; height:76px; border-radius:50%; }
  h1 { font-size:34px; margin:0; letter-spacing:.02em; text-transform:uppercase; }
  h2 { font-size:40px; margin:0 0 8px; }
  .sub { color:var(--dim); margin:4px 0 20px; }
  button, input, textarea { font:inherit; color:inherit; }
  button { background:var(--card); border:2px solid var(--line); border-radius:14px; padding:0 20px; min-height:68px; cursor:pointer; }
  button:active { transform:scale(.98); }
  button:disabled { opacity:.35; }
  button.go { background:var(--red); border-color:var(--red); color:#fff; font-weight:700; }
  button.sel { border-color:var(--gold); background:#2a2208; }
  button.small { min-height:48px; font-size:17px; padding:0 14px; }
  .letters { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:18px; }
  .letters button { min-height:54px; min-width:54px; padding:0 14px; font-weight:700; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(230px, 1fr)); gap:12px; align-content:start; flex:1; padding-bottom:20px; }
  .grid button { text-align:left; font-size:22px; font-weight:600; overflow-wrap:anywhere; padding:10px 18px; }
  .grid button.in { border-color:var(--gold); }
  .grid button.in::after { content:" ✓"; color:var(--gold); }
  .classes button.done { border-color:var(--gold); color:var(--gold); opacity:.6; }
  .classes { grid-template-columns:repeat(auto-fill, minmax(280px, 1fr)); flex:none; }
  .classes button { min-height:96px; font-size:26px; text-align:center; }
  .bar { position:sticky; bottom:0; display:flex; gap:12px; flex-wrap:wrap; align-items:center; background:var(--bg);
         border-top:2px solid var(--line); padding:14px 0 max(14px, env(safe-area-inset-bottom)); margin-top:auto; }
  .bar .push { margin-left:auto; }
  .center { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:14px; }
  .tick { font-size:120px; line-height:1; color:var(--red); }
  input, textarea { background:var(--card); border:2px solid var(--line); border-radius:14px; padding:14px 18px;
         -webkit-user-select:text; user-select:text; }
  input.name { font-size:30px; width:min(640px, 100%); }
  pre { background:var(--card); border-radius:14px; padding:18px; font:17px/1.45 ui-monospace, Menlo, monospace;
        white-space:pre-wrap; -webkit-user-select:text; user-select:text; margin:0 0 14px; }
  section { margin-bottom:34px; }
  section h3 { margin:0 0 12px; font-size:22px; color:var(--gold); text-transform:uppercase; letter-spacing:.05em; }
  .row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:10px; }
  .row .grow { flex:1; min-width:200px; }
  body.bright { background:#fff; color:#000; }
  body.bright .sub { color:#444; }
  .red { color:#ff4d5e; font-weight:700; }
  .tag { border:2px solid var(--line); border-radius:999px; padding:4px 12px; font-size:16px; color:var(--dim); }
  details summary { cursor:pointer; color:var(--dim); margin:4px 0 12px; }
  body.bright button.undo { background:#fff; color:#000; border-color:#bbb; margin-top:18px; }
  .warn { background:#3d0a12; border:2px solid var(--red); border-radius:14px; padding:14px 18px; margin-bottom:18px; }
</style>
</head>
<body>
<div id="app"></div>
<script>
// Pure functions; checkin/test.mjs runs everything between the next two markers.
// --- logic ---
const DEFAULT_CLASSES = ['Morning Jiu-Jitsu', 'Adult Jiu-Jitsu','Kids Jiu-Jitsu', 'MMA', 'Muay-Thai/Kickboxing', 'Saturday Competition Class'];
const pad = (n) => String(n).padStart(2, '0');
// Local date, not UTC: a 7pm class in Owensboro must not land on tomorrow's roster.
const dayOf = (d) => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const timeOf = (d) => pad(d.getHours()) + ':' + pad(d.getMinutes());
// '18:05' -> '6:05 PM' for people; the stored time stays 24-hour so it sorts.
const clock = (t) => ((+t.slice(0, 2) % 12) || 12) + t.slice(2) + (+t.slice(0, 2) < 12 ? ' AM' : ' PM');
const cleanName = (s) => s.trim().replace(/\s+/g, ' ');

// A check-in may carry `p`, the ISO time of the pull that exported it; `pulls` logs each pull.
// `dirty` is false only while everything on the iPad is also in a backup file.
function fresh() {
  return { v: 1, nextId: 1, classes: DEFAULT_CLASSES.slice(), students: {}, checkins: [], pulls: [], dirty: false };
}

// Returns the student's id. A name already on file (any capitalisation) is reused,
// and a removed student who comes back gets their history back.
function addStudent(db, rawName) {
  const name = cleanName(rawName);
  const hit = Object.keys(db.students).find((id) => db.students[id].name.toLowerCase() === name.toLowerCase());
  if (hit) { delete db.students[hit].gone; return hit; }
  const id = String(db.nextId++);
  db.students[id] = { name };
  return id;
}

// Each check-in is its own record with its own time, so a morning class and an evening class
// show their real times. It holds only classes the student isn't already in today (no class runs
// twice a day). Earlier records never change, so a pulled file always matches the iPad.
function checkIn(db, ids, classes, now) {
  const d = dayOf(now);
  for (const s of ids) {
    const today = db.checkins.filter((x) => x.s === s && x.d === d);
    const had = new Set(today.flatMap((x) => x.c));
    const add = classes.filter((c) => !had.has(c));
    if (add.length || !today.length) db.checkins.push({ s, d, t: timeOf(now), c: add });
    db.students[s].last = classes.slice();
  }
}
// The name screen's ✓ covers one half of the day, so an evening student isn't shown as already in.
const half = (t) => (t < '12:00' ? 'AM' : 'PM');

const rowsOf = (db, recs) => recs
  .map((r) => ({ s: r.s, d: r.d, t: r.t, name: db.students[r.s].name, c: r.c }))
  .sort((a, b) => (a.d + a.t + a.name).localeCompare(b.d + b.t + b.name));

const longDate = (day) => new Date(day + 'T12:00:00').toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
// 'Monday, October 5, 2026' for one day, 'Sep 28 to Oct 5, 2026' for a range (Latin-1, for the PDF).
function rangeTitle(from, to) {
  if (from === to) return longDate(from);
  const md = (d) => new Date(d + 'T12:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
  return md(from) + (from.slice(0, 4) === to.slice(0, 4) ? '' : ', ' + from.slice(0, 4)) + ' to ' + md(to) + ', ' + to.slice(0, 4);
}

// Attendance by day, then by class: every class that had someone, in the coach's class order.
function reportData(db, recs) {
  const rows = rowsOf(db, recs);
  return [...new Set(rows.map((r) => r.d))].sort().map((day) => {
    const rs = rows.filter((r) => r.d === day);
    const names = db.classes.slice();
    for (const r of rs) for (const c of r.c) if (!names.includes(c)) names.push(c);
    const groups = names.map((g) => ({ name: g, who: rs.filter((r) => r.c.includes(g)) }));
    groups.push({ name: 'No class picked', who: rs.filter((r) => !r.c.length) });
    return { day, date: longDate(day), total: new Set(rs.map((r) => r.s)).size, groups: groups.filter((g) => g.who.length) };
  });
}
const rosterData = (db, day) => reportData(db, db.checkins.filter((r) => r.d === day))[0] || { date: longDate(day), total: 0, groups: [] };

function rosterText(db, day) {
  const r = rosterData(db, day);
  const out = ['Asylum Martial Arts attendance', r.date, r.total + ' checked in'];
  for (const g of r.groups) out.push('', g.name + ' (' + g.who.length + ')', ...g.who.map((w) => '  ' + w.name + '  ' + clock(w.t)));
  return out.join('\n');
}

// The roster as a printable PDF, written by hand so the page needs no library: Letter pages,
// Helvetica, black on white with grey class bands. `logo` is a 240x240 JPEG as a binary string
// (one char per byte), drawn clipped to a circle; leave it out and the header is text only.
// ponytail: Latin-1 text only; a name in another script prints as "?". Embed a font if that matters.
// `recs` are the check-ins to print and `title` the date line: one day prints like a sign-in sheet,
// several days get a heading per day. The big number is check-ins (one per student per day).
function pdfRoster(db, recs, title, logo) {
  const days = reportData(db, recs);
  const one = days.length <= 1;
  const total = days.reduce((n, d) => n + d.total, 0);
  const esc = (s) => String(s).replace(/[^\x20-\xff]/g, '?').replace(/[\\()]/g, '\\$&');
  const T = (f, size, x, y, s, grey) => (grey ? grey + ' g ' : '') + 'BT /' + f + ' ' + size + ' Tf ' + x + ' ' + y + ' Td (' + esc(s) + ') Tj ET' + (grey ? ' 0 g' : '');
  // Helvetica digits are all 556 wide, so counts and times can be right-aligned from this short table.
  const WIDE = { ':': 278, ' ': 278, A: 667, P: 667, M: 833 };
  const numW = (s, size) => [...String(s)].reduce((w, ch) => w + (WIDE[ch] || 556), 0) * size / 1000;
  const L = 56, R = 556, BOTTOM = 64;
  const pages = [];
  let ops, y;
  const newPage = () => {
    ops = []; pages.push(ops);
    if (pages.length === 1) {
      if (logo) {
        // Circle clip (four Bezier arcs) so the JPEG's black corners never reach the paper.
        const cx = L + 32, cy = 704, q = 31, k = q * 0.5523;
        ops.push('q ' + (cx + q) + ' ' + cy + ' m '
          + [[q, k, k, q, 0, q], [-k, q, -q, k, -q, 0], [-q, -k, -k, -q, 0, -q], [k, -q, q, -k, q, 0]]
            .map((c) => c.map((v, i) => (i % 2 ? cy : cx) + v).join(' ') + ' c').join(' ')
          + ' W n 64 0 0 64 ' + L + ' 672 cm /Im1 Do Q');
      }
      const x = logo ? L + 80 : L;
      ops.push(T('F2', 20, x, 716, 'ASYLUM MARTIAL ARTS'), T('F1', 12, x, 697, 'Class attendance', 0.4), T('F1', 12, x, 679, title));
      // 47.8 and 42.2: Helvetica 10pt widths of the two labels.
      ops.push(T('F2', 30, R - numW(total, 30), 698, total), T('F1', 10, R - (one ? 47.8 : 42.2), 682, one ? 'checked in' : 'check-ins', 0.4));
      ops.push('1.5 w ' + L + ' 660 m ' + R + ' 660 l S');
      y = 636;
    } else {
      ops.push(T('F2', 10, L, 742, 'ASYLUM MARTIAL ARTS'), T('F1', 10, L + 130, 742, title, 0.4), '1 w ' + L + ' 734 m ' + R + ' 734 l S');
      y = 712;
    }
  };
  newPage();
  if (!days.length) ops.push(T('F1', 12, L, y - 14, 'Nobody checked in.', 0.4));
  for (const d of days) {
    if (!one) {
      if (y - 84 < BOTTOM) newPage(); // a day heading never sits alone at the foot of a page
      ops.push(T('F2', 15, L, y - 18, d.date), T('F2', 15, R - numW(d.total, 15), y - 18, d.total),
        '1 w ' + L + ' ' + (y - 26) + ' m ' + R + ' ' + (y - 26) + ' l S');
      y -= 36;
    }
    for (const g of d.groups) {
      if (y - 42 < BOTTOM) newPage(); // nor a class heading
      ops.push('0.9 g ' + L + ' ' + (y - 22) + ' ' + (R - L) + ' 22 re f 0 g',
        T('F2', 13, L + 8, y - 16, g.name), T('F2', 13, R - 8 - numW(g.who.length, 13), y - 16, g.who.length));
      y -= 22;
      for (const w of g.who) {
        if (y - 20 < BOTTOM) newPage();
        ops.push(T('F1', 12, L + 8, y - 14, w.name), T('F1', 12, R - 8 - numW(clock(w.t), 12), y - 14, clock(w.t), 0.4),
          '0.8 G 0.5 w ' + L + ' ' + (y - 20) + ' m ' + R + ' ' + (y - 20) + ' l S 0 G');
        y -= 20;
      }
      y -= 14;
    }
    if (!one) y -= 10;
  }
  pages.forEach((p, i) => p.push(T('F1', 9, L, 40, 'Page ' + (i + 1) + ' of ' + pages.length, 0.4)));

  const font = (n) => '<< /Type /Font /Subtype /Type1 /BaseFont /' + n + ' /Encoding /WinAnsiEncoding >>';
  const objs = ['<< /Type /Catalog /Pages 2 0 R >>', '', font('Helvetica'), font('Helvetica-Bold'),
    '<< /Type /XObject /Subtype /Image /Width 240 /Height 240 /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '
      + (logo || '').length + ' >>\nstream\n' + (logo || '') + '\nendstream'];
  const kids = pages.map((p) => {
    const body = p.join('\n');
    objs.push('<< /Type /Page /Parent 2 0 R /MediaBox [0 0 612 792] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> /XObject << /Im1 5 0 R >> >> /Contents ' + (objs.length + 2) + ' 0 R >>');
    objs.push('<< /Length ' + body.length + ' >>\nstream\n' + body + '\nendstream');
    return (objs.length - 1) + ' 0 R';
  });
  objs[1] = '<< /Type /Pages /Kids [' + kids.join(' ') + '] /Count ' + kids.length + ' >>';
  let out = '%PDF-1.4\n';
  const at = objs.map((o, i) => { const off = out.length; out += (i + 1) + ' 0 obj\n' + o + '\nendobj\n'; return off; });
  const xref = out.length;
  out += 'xref\n0 ' + (objs.length + 1) + '\n0000000000 65535 f \n' + at.map((o) => String(o).padStart(10, '0') + ' 00000 n \n').join('');
  return out + 'trailer\n<< /Size ' + (objs.length + 1) + ' /Root 1 0 R >>\nstartxref\n' + xref + '\n%%EOF\n';
}

// --- pulls ---
const daysBetween = (a, b) => Math.round((Date.parse(b + 'T12:00:00') - Date.parse(a + 'T12:00:00')) / 864e5);

// What a pull would take now: count, first and last day, and age in days of the oldest.
function waiting(db, today) {
  const days = db.checkins.filter((r) => !r.p).map((r) => r.d).sort();
  if (!days.length) return null;
  return { n: days.length, from: days[0], to: days[days.length - 1], age: Math.max(0, daysBetween(days[0], today)) };
}

// The pull as the iPad will look after it, without touching `db`: the caller saves `next` only
// once the PDF of `recs` has been shared.
function pullDraft(db, now) {
  const at = now.toISOString();
  const next = JSON.parse(JSON.stringify(db));
  const recs = next.checkins.filter((r) => !r.p);
  if (!recs.length) return null;
  const days = recs.map((r) => r.d).sort();
  recs.forEach((r) => { r.p = at; });
  next.pulls.push({ at, n: recs.length, from: days[0], to: days[days.length - 1] });
  return { at, next, recs, title: rangeTitle(days[0], days[days.length - 1]) };
}

const backupText = (db, now) => JSON.stringify(Object.assign({}, db, { dirty: false, exportedAt: now.toISOString() }));

// A backup file as a db, or null if it is not exactly the shape this app writes. Nothing a
// student typed is trusted: ids, dates, times and pull marks are all checked before a restore.
function readBackup(text) {
  let b;
  try { b = JSON.parse(text); } catch (e) { return null; }
  const str = (x) => typeof x === 'string' && x.length <= 60;
  const strs = (a) => Array.isArray(a) && a.every(str);
  const realDay = (d) => typeof d === 'string' && /^\d{4}-\d\d-\d\d$/.test(d) && dayOf(new Date(d + 'T12:00:00')) === d;
  const realTime = (t) => typeof t === 'string' && /^([01]\d|2[0-3]):[0-5]\d$/.test(t);
  const isObj = (o) => o && typeof o === 'object' && !Array.isArray(o);
  if (!isObj(b) || b.v !== 1 || !strs(b.classes) || !isObj(b.students) || !Array.isArray(b.checkins)) return null;
  for (const [id, s] of Object.entries(b.students))
    if (!/^\d{1,9}$/.test(id) || !isObj(s) || !str(s.name) || !s.name.trim()
      || (s.gone !== undefined && typeof s.gone !== 'boolean') || (s.last !== undefined && !strs(s.last))) return null;
  const pulls = b.pulls === undefined ? [] : b.pulls;
  if (!Array.isArray(pulls) || !pulls.every((p) => isObj(p) && typeof p.at === 'string' && !isNaN(Date.parse(p.at))
    && Number.isInteger(p.n) && realDay(p.from) && realDay(p.to))) return null;
  const ats = new Set(pulls.map((p) => p.at));
  if (!b.checkins.every((r) => isObj(r) && typeof r.s === 'string' && Object.hasOwn(b.students, r.s)
    && realDay(r.d) && realTime(r.t) && strs(r.c) && (r.p === undefined || ats.has(r.p)))) return null;
  const top = Math.max(0, ...Object.keys(b.students).map(Number));
  return {
    v: 1, nextId: Math.max(top + 1, Number.isInteger(b.nextId) ? b.nextId : 0), classes: b.classes,
    students: b.students, checkins: b.checkins, pulls, dirty: false,
    exportedAt: typeof b.exportedAt === 'string' ? b.exportedAt : null,
  };
}

// --- storage ---
const KEY = 'asylum.checkin.v1';
const RESERVE = KEY + '.reserve'; // filler that is given up when the iPad is full, so a check-in still saves
const isFull = (e) => !!e && (e.name === 'QuotaExceededError' || e.code === 22);

// Writes `db` to `store` and returns what was written, or null with nothing changed. When the
// device is full it makes room on a copy, in order: pulled check-ins, oldest day first (they are
// already in a pull file), then the reserve. Unpulled check-ins and students are never dropped.
function persist(store, db) {
  let next = db;
  for (;;) {
    try { store.setItem(KEY, JSON.stringify(next)); return next; }
    catch (e) {
      if (!isFull(e)) return null;
      const pulled = next.checkins.filter((r) => r.p);
      if (pulled.length) {
        const day = pulled.map((r) => r.d).sort()[0];
        const n = pulled.filter((r) => r.d === day).length;
        const f = next.freed;
        next = Object.assign({}, next, {
          checkins: next.checkins.filter((r) => !(r.p && r.d === day)),
          freed: { n: (f ? f.n : 0) + n, from: f ? f.from : day, to: day },
        });
      } else if (store.getItem(RESERVE) != null) store.removeItem(RESERVE);
      else return null;
    }
  }
}

// The coach PIN is set on the iPad the first time someone taps Coach, and lives only there, never in
// this public file. Plain text on purpose: anyone who can read it can already read the attendance.
const PIN_KEY = 'asylum.checkin.pin';
let corrupt = false, readOnly = false, badRaw = null, saveFailed = false;
function load() {
  let raw = null;
  try { raw = localStorage.getItem(KEY); } catch (e) {}
  if (!raw) return fresh();
  try {
    const d = JSON.parse(raw);
    if (d.v !== 1) throw new Error('schema');
    d.pulls = d.pulls || [];
    return d;
  } catch (e) {
    // Never overwrite data we can't read: park it under another key first. If even that fails,
    // write nothing at all, so the original stays where it is.
    badRaw = raw;
    try { localStorage.setItem(KEY + '.corrupt.' + Date.now(), raw); corrupt = true; } catch (e2) { readOnly = true; }
    return fresh();
  }
}
let db = load();
function ensureReserve() {
  try { if (localStorage.getItem(RESERVE) == null) localStorage.setItem(RESERVE, 'x'.repeat(50000)); } catch (e) {}
}
ensureReserve();

// Every change goes through here: made on a copy, and kept only if it saved, so what is on screen
// is always what is on the iPad. `fn` edits the copy or returns a replacement. `clean` marks the
// result as already in a backup file.
function commit(fn, clean) {
  let next = JSON.parse(JSON.stringify(db));
  next = fn(next) || next;
  next.dirty = !clean;
  const done = readOnly ? null : persist(localStorage, next);
  saveFailed = !done;
  if (done) db = done;
  return !!done;
}

const app = document.getElementById('app');
let letter = null, multi = false, sel = new Set(), timer = null;

function el(tag, props, ...kids) {
  const n = Object.assign(document.createElement(tag), props || {});
  n.append(...kids.filter((k) => k != null));
  return n;
}
const btn = (label, cls, onclick) => el('button', { className: cls || '', onclick }, label);
let homeAt = null; // the day and half the name screen was drawn for; null when it isn't showing
function show(...nodes) {
  homeAt = null;
  clearTimeout(timer);
  document.body.className = '';
  app.replaceChildren(...nodes.filter((n) => n != null));
  window.scrollTo(0, 0);
}
// Idle timeout for the current screen; any tap or keystroke starts it over.
let rearm = null;
const after = (ms, fn) => { rearm = () => { clearTimeout(timer); timer = setTimeout(fn, ms); }; rearm(); };
const hold = () => { clearTimeout(timer); rearm = null; }; // while a share sheet or file picker is open
for (const ev of ['pointerdown', 'keydown']) addEventListener(ev, () => rearm && rearm(), true);
const IDLE = 30000;
const active = () => Object.keys(db.students).filter((id) => !db.students[id].gone)
  .sort((a, b) => db.students[a].name.localeCompare(db.students[b].name));
const names = (ids) => ids.map((id) => db.students[id].name).join(', ');
const count = (n) => n + (n === 1 ? ' check-in' : ' check-ins');
const nice = (day) => new Date(day + 'T12:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric' });

function home() {
  const today = dayOf(new Date()), now = half(timeOf(new Date()));
  const here = new Set(db.checkins.filter((r) => r.d === today && half(r.t) === now).map((r) => r.s));
  const all = active();
  const initials = [...new Set(all.map((id) => db.students[id].name[0].toUpperCase()))];
  if (letter && !initials.includes(letter)) letter = null;
  const shown = letter ? all.filter((id) => db.students[id].name[0].toUpperCase() === letter) : all;

  const letters = el('div', { className: 'letters' },
    btn('All', letter ? '' : 'sel', () => { letter = null; home(); }),
    ...initials.map((L) => btn(L, L === letter ? 'sel' : '', () => { letter = L; home(); })));

  const grid = el('div', { className: 'grid' }, ...shown.map((id) =>
    btn(db.students[id].name, (here.has(id) ? 'in ' : '') + (sel.has(id) ? 'sel' : ''), () => {
      if (!multi) return pick([id]);
      sel.has(id) ? sel.delete(id) : sel.add(id);
      home();
    })));

  show(
    el('div', { className: 'brand' },
      el('img', { src: 'data:image/jpeg;base64,' + LOGO_JPEG, alt: '' }),
      el('h1', {}, 'Asylum Martial Arts')),
    el('p', { className: 'sub' }, multi ? 'Tap every name you are checking in, then Check in.'
      : all.length ? 'Tap your name to check in.' : 'First time here? Tap "I\'m new".'),
    all.length > 12 ? letters : null,
    grid,
    el('div', { className: 'bar' },
      btn("I'm new", '', newStudent),
      all.length > 1 ? btn(multi ? 'Cancel several' : 'Several kids', multi ? 'sel' : '', () => { multi = !multi; sel.clear(); home(); }) : null,
      multi ? btn('Check in ' + sel.size, 'go', () => pick([...sel])) : null,
      btn('Coach', 'small push', coachGate)));
  if (multi) app.querySelector('.go').disabled = !sel.size;
  rearm = null;
  if (multi || letter) after(IDLE, reset);
  homeAt = today + now;
}
// Redraw the name screen at noon and midnight, so old ✓ marks don't sit there until someone taps.
setInterval(() => { if (homeAt && homeAt !== dayOf(new Date()) + half(timeOf(new Date()))) home(); }, 60000);
function reset() { multi = false; sel.clear(); letter = null; home(); }

function notSaved() {
  show(el('div', { className: 'center' },
    el('div', { className: 'tick' }, '!'),
    el('h2', {}, 'Not saved'),
    el('p', {}, 'Please tell the coach.')));
  timer = setTimeout(reset, 8000);
}

function newStudent() {
  const input = el('input', { className: 'name', placeholder: 'First and last name', autocapitalize: 'words', autocomplete: 'off', spellcheck: false, maxLength: 40 });
  const go = btn('Save', 'go', () => {
    const name = cleanName(input.value);
    if (name.length < 2) return;
    let id;
    if (!commit((n) => { id = addStudent(n, name); })) return notSaved();
    if (multi) { sel.add(id); home(); } else pick([id]);
  });
  input.onkeydown = (e) => { if (e.key === 'Enter') go.click(); };
  show(el('div', { className: 'center' },
    el('h2', {}, 'Welcome!'),
    el('p', { className: 'sub' }, 'Type your name once. Next time you just tap it.'),
    input,
    el('div', { className: 'row' }, btn('Cancel', '', home), go)));
  input.focus();
  after(IDLE, reset);
}

function pick(ids) {
  if (!db.classes.length) return finish(ids, []);
  // Start from what this student picked last time: a regular is one tap from done. Classes they
  // are already checked into today show a ✓ and can't be picked again.
  const today = dayOf(new Date());
  const done = new Set(ids.length === 1 ? db.checkins.filter((r) => r.s === ids[0] && r.d === today).flatMap((r) => r.c) : []);
  const last = ids.length === 1 ? (db.students[ids[0]].last || []) : [];
  const chosen = new Set(last.filter((c) => db.classes.includes(c) && !done.has(c)));
  const go = btn('Check in', 'go', () => finish(ids, db.classes.filter((c) => chosen.has(c))));
  const grid = el('div', { className: 'grid classes' }, ...db.classes.map((c) => {
    if (done.has(c)) { const d = btn(c + ' ✓', 'done'); d.disabled = true; return d; }
    const b = btn(c, chosen.has(c) ? 'sel' : '', () => {
      chosen.has(c) ? chosen.delete(c) : chosen.add(c);
      b.className = chosen.has(c) ? 'sel' : '';
      go.disabled = !chosen.size;
    });
    return b;
  }));
  go.disabled = !chosen.size;
  show(
    el('h2', {}, 'Hi ' + names(ids)),
    el('p', { className: 'sub' }, 'What are you here for today? Tap every class.'),
    grid,
    el('div', { className: 'bar' }, btn('Not me', '', reset), el('span', { className: 'push' }), go));
  after(IDLE, reset);
}

function finish(ids, classes) {
  const before = JSON.stringify(db);
  if (!commit((n) => checkIn(n, ids, classes, new Date()))) return notSaved();
  show(el('div', { className: 'center' },
    el('div', { className: 'tick' }, '✓'),
    el('h2', {}, "You're checked in"),
    el('p', {}, names(ids)),
    el('p', { className: 'sub' }, classes.join(' · ')),
    btn('Undo, that was a mistake', 'undo', () => {
      if (!commit(() => JSON.parse(before))) alert('Could not undo. Please tell the coach.');
      reset();
    })));
  document.body.className = 'bright';
  rearm = null;
  timer = setTimeout(reset, 5000);
}

let backupNudge = false; // set by a pull, cleared by the next backup
let pinMisses = 0, pinLockedUntil = 0;
function coachGate() {
  let pin = null;
  try { pin = localStorage.getItem(PIN_KEY); } catch (e) {}
  if (!pin) return setPin(true);
  if (Date.now() < pinLockedUntil) return alert('Too many wrong PINs. Try again in 30 seconds.');
  if (prompt('Coach PIN') !== pin) {
    if (++pinMisses >= 3) { pinMisses = 0; pinLockedUntil = Date.now() + 30000; }
    return;
  }
  pinMisses = 0;
  coach(dayOf(new Date()));
}
function setPin(first) {
  const a = prompt(first ? 'No coach PIN yet. Choose one, 4 to 8 digits. Keep it from students.' : 'New coach PIN, 4 to 8 digits');
  if (a == null) return;
  if (!/^\d{4,8}$/.test(a)) return alert('Use 4 to 8 digits. Nothing changed.');
  if (prompt('Type the same PIN again') !== a) return alert('Those did not match. Nothing changed.');
  try { localStorage.setItem(PIN_KEY, a); } catch (e) { return alert('Could not save the PIN.'); }
  if (first) coach(dayOf(new Date()));
  else alert('PIN changed.');
}

// Hands files to the iPad share sheet (AirDrop, Mail, Messages, Save to Files). True only when the
// share went through. With no share sheet (a desktop browser) it downloads them and asks.
// One file per call: the iPad opened nothing for a two-file share (Wyatt's test, 2026-10-05).
async function shareFiles(files) {
  if (navigator.canShare && navigator.canShare({ files })) {
    try { await navigator.share({ files }); return true; }
    catch (e) { if (e.name !== 'AbortError') alert('The share sheet did not open (' + e.name + '). Tell Wyatt.'); return false; }
  }
  for (const f of files) el('a', { href: URL.createObjectURL(f), download: f.name }).click();
  return confirm(files.length > 1 ? 'Did all ' + files.length + ' files save?' : 'Did the file save?');
}
// One character is one byte in pdfRoster's output, which is what its offsets assume.
const pdfFile = (recs, title, name) => new File([Uint8Array.from(pdfRoster(db, recs, title, atob(LOGO_JPEG)), (ch) => ch.charCodeAt(0))],
  name + '.pdf', { type: 'application/pdf' });
const jsonFile = (text, name) => new File([text], name + '.json', { type: 'application/json' });

function usedChars() {
  let n = 0;
  try {
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      n += k.length + (localStorage.getItem(k) || '').length;
    }
  } catch (e) {}
  return n;
}
const BUDGET = 2500000; // Safari's ~5 MB of localStorage, counted as UTF-16 characters

function coach(day) {
  const today = dayOf(new Date());
  const again = () => coach(day);
  const text = rosterText(db, day);
  const dayIn = el('input', { type: 'date', value: day, max: today, onchange: () => coach(dayIn.value || today) });
  const from = el('input', { type: 'date', value: day.slice(0, 8) + '01', max: today });
  const to = el('input', { type: 'date', value: day, max: today });
  const classBox = el('textarea', { rows: Math.max(4, db.classes.length + 1), className: 'grow', value: db.classes.join('\n') });
  const w = waiting(db, today);
  const used = usedChars() / BUDGET;
  let reserveGone = false;
  try { reserveGone = localStorage.getItem(RESERVE) == null; } catch (e) {}
  const pulledCount = db.checkins.filter((r) => r.p).length;
  const dayRecs = db.checkins.map((r, i) => ({ r, i })).filter((x) => x.r.d === day);
  const dayPulls = [...new Set(dayRecs.map((x) => x.r.p).filter(Boolean))].sort();
  const dayTag = !dayRecs.length ? null : !dayPulls.length ? 'Not pulled'
    : dayRecs.every((x) => x.r.p) ? 'Pulled ' + nice(dayOf(new Date(dayPulls[dayPulls.length - 1]))) : 'Partly pulled';
  const stamp = 'asylum-attendance-' + today;

  const pullBtn = btn('Pull', 'go', async () => {
    try {
      const draft = pullDraft(db, new Date());
      if (!draft) return;
      hold();
      if (!await shareFiles([pdfFile(draft.recs, draft.title, stamp)])) alert('Not pulled. Nothing was marked.');
      else if (!commit(() => draft.next)) alert("Shared, but couldn't mark these as pulled. The next pull will include them again.");
      else backupNudge = true;
    } catch (e) { alert('Pull failed: ' + e.message + '. Tell Wyatt.'); }
    again();
  });
  const backupNow = async () => {
    hold();
    if (await shareFiles([jsonFile(backupText(db, new Date()), 'asylum-backup-' + today)])) {
      if (commit(() => {}, true)) backupNudge = false;
      else alert("Backed up, but couldn't record it.");
    }
    again();
  };
  pullBtn.disabled = !w;

  const restoreIn = el('input', { type: 'file', accept: '.json,application/json', hidden: true, onchange: async () => {
    const f = restoreIn.files[0];
    if (!f) return again();
    if (f.size > 4e6) { alert('Not a check-in backup. Nothing changed.'); return again(); }
    const b = readBackup(await f.text());
    if (!b) { alert('Not a check-in backup. Nothing changed.'); return again(); }
    const when = b.exportedAt ? new Date(b.exportedAt).toLocaleString('en-US') : 'unknown date';
    delete b.exportedAt;
    if (confirm('Replace everything on this iPad with the backup from ' + when + '?\n'
      + Object.keys(b.students).length + ' students, ' + b.checkins.length + ' check-ins.')) {
      alert(commit(() => b, true) ? 'Restored.' : 'Could not restore. Nothing changed.');
    }
    again();
  } });
  const canRestore = !w && db.dirty === false && !readOnly;

  show(
    el('div', { className: 'row' }, el('h1', { className: 'grow' }, 'Coach'), btn('Back to check-in', 'go', reset)),
    readOnly ? el('div', { className: 'warn' }, "Saved data can't be read, and nothing new is being saved. Tell Wyatt. ",
      btn('Share raw data', 'small', () => { hold(); shareFiles([new File([badRaw], 'asylum-raw-' + today + '.txt', { type: 'text/plain' })]).then(again); }))
      : corrupt ? el('div', { className: 'warn' }, 'Saved data could not be read and was set aside. Tell Wyatt before clearing anything. ',
        btn('Share raw data', 'small', () => { hold(); shareFiles([new File([badRaw], 'asylum-raw-' + today + '.txt', { type: 'text/plain' })]).then(again); }))
      : null,
    saveFailed ? el('div', { className: 'warn' }, 'The last change could not be saved. Pull now, then Delete pulled history.') : null,
    reserveGone ? el('div', { className: 'warn' }, 'Storage is full. Pull now, then Delete pulled history.') : null,
    db.freed ? el('div', { className: 'warn' },
      'To make room, ' + count(db.freed.n) + ' already pulled, from ' + nice(db.freed.from) + ' to ' + nice(db.freed.to)
        + ' were deleted from this iPad. They are in the pull files. ',
      btn('OK', 'small', () => { commit((n) => { delete n.freed; }, db.dirty === false); again(); })) : null,

    el('section', {}, el('h3', {}, 'Pull'),
      el('div', { className: 'row' },
        el('span', { className: 'grow' + (w && w.age >= 14 ? ' red' : '') }, w
          ? 'Waiting: ' + count(w.n) + ', ' + nice(w.from) + (w.to !== w.from ? ' to ' + nice(w.to) : '')
            + (w.age ? ' (oldest ' + w.age + (w.age === 1 ? ' day)' : ' days)') : '')
          : 'Nothing waiting. Everything has been pulled.'),
        pullBtn),
      backupNudge ? el('div', { className: 'warn row' }, el('span', { className: 'grow' }, 'Pulled. Now save a backup too.'), btn('Back up now', 'go', backupNow)) : null,
      el('p', { className: 'sub' }, 'Pull shares a PDF of everything waiting, by day and class, and marks it pulled. Then Back up now. Every week or two.'),
      ...db.pulls.slice(-8).reverse().map((p) => {
        const left = db.checkins.filter((r) => r.p === p.at);
        return el('div', { className: 'row' },
          el('span', { className: 'grow' }, 'Pulled ' + new Date(p.at).toLocaleString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' })
            + ': ' + nice(p.from) + (p.to !== p.from ? ' to ' + nice(p.to) : '') + ', ' + count(p.n)
            + (left.length && left.length < p.n ? ' (' + left.length + ' still on this iPad)' : '')),
          left.length ? btn('Share PDF again', 'small', () => {
            hold(); shareFiles([pdfFile(left, rangeTitle(p.from, p.to), 'asylum-attendance-pulled-' + p.at.slice(0, 10))]).then(again);
          }) : null);
      })),

    el('section', {}, el('h3', {}, 'Roster'),
      el('div', { className: 'row' }, dayIn, dayTag ? el('span', { className: 'tag' }, dayTag) : null,
        btn('Share PDF', 'go push', () => {
          hold(); shareFiles([pdfFile(dayRecs.map((x) => x.r), longDate(day), 'asylum-attendance-' + day)]).then(again);
        })),
      el('pre', {}, text),
      dayRecs.length ? el('details', {}, el('summary', {}, 'Delete a check-in'),
        ...dayRecs.map(({ r, i }) => el('div', { className: 'row' },
          el('span', { className: 'grow' }, db.students[r.s].name + ', ' + clock(r.t) + ', ' + (r.c.join(', ') || 'no class')),
          r.p ? el('span', { className: 'tag' }, 'Pulled, kept') : btn('Delete', 'small', () => {
            if (!confirm('Delete ' + db.students[r.s].name + "'s check-in on " + nice(r.d) + '?')) return;
            commit((n) => { n.checkins.splice(i, 1); });
            again();
          })))) : null),

    el('section', {}, el('h3', {}, 'Date range'),
      el('div', { className: 'row' }, from, 'to', to,
        btn('Share PDF', '', () => {
          const f = from.value, t = to.value < from.value ? from.value : to.value;
          hold(); shareFiles([pdfFile(db.checkins.filter((r) => r.d >= f && r.d <= t), rangeTitle(f, t), 'asylum-attendance-' + f + '-to-' + t)]).then(again);
        })),
      el('p', { className: 'sub' }, 'Any dates. This does not mark anything as pulled.')),

    el('section', {}, el('h3', {}, 'Backup'),
      el('p', {}, db.dirty === false ? 'Everything on this iPad is in a backup file.' : 'Changed since the last backup.'),
      el('div', { className: 'row' },
        btn('Back up now', '', backupNow),
        (() => { const b = btn('Restore from backup', '', () => restoreIn.click()); b.disabled = !canRestore; return b; })(),
        restoreIn),
      el('p', { className: 'sub' }, canRestore
        ? 'Restore replaces everything on this iPad with a backup file. Use the newest one.'
        : w ? 'To restore: Pull first, so nothing waiting is lost.' : 'To restore: Back up now first, so this iPad can be put back.')),

    el('section', {}, el('h3', {}, 'Classes'),
      el('div', { className: 'row' }, classBox,
        btn('Save classes', '', () => {
          commit((n) => { n.classes = [...new Set(classBox.value.split('\n').map(cleanName).filter(Boolean))]; });
          again();
        })),
      el('p', { className: 'sub' }, 'One class per line. These are the buttons students see.')),

    el('section', {}, el('h3', {}, 'Students (' + active().length + ')'),
      ...active().map((id) => el('div', { className: 'row' },
        el('span', { className: 'grow' }, db.students[id].name),
        btn('Rename', 'small', () => {
          const n = cleanName(prompt('New name', db.students[id].name) || '');
          if (n.length >= 2) { commit((x) => { x.students[id].name = n; }); again(); }
        }),
        btn('Remove', 'small', () => {
          if (!confirm('Remove ' + db.students[id].name + ' from the check-in screen? Past attendance is kept.')) return;
          commit((x) => { x.students[id].gone = true; }); again();
        })))),

    el('section', {}, el('h3', {}, 'Storage'),
      el('p', { className: used >= 0.75 ? 'red' : '' }, 'App data: ' + Math.round(usedChars() * 2 / 1024) + ' KB, about '
        + Math.round(used * 100) + '% of the ~5 MB this iPad allows.'),
      el('div', { className: 'row' },
        (() => {
          const b = btn('Delete pulled history (' + pulledCount + ')', '', () => {
            if (!confirm('Delete ' + count(pulledCount) + ' already in pull files? Waiting check-ins and students stay.')) return;
            commit((n) => { n.checkins = n.checkins.filter((r) => !r.p); });
            ensureReserve(); again();
          });
          b.disabled = !pulledCount; return b;
        })(),
        btn('Change coach PIN', '', () => setPin(false)))));
  after(120000, reset);
}

home();
if (navigator.storage && navigator.storage.persist) navigator.storage.persist();
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js');
// Another open copy saved: reload, so this one never writes over it with stale data.
addEventListener('storage', (e) => { if (e.key === KEY) location.reload(); });
</script>
</body>
</html>
